<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoCut Live Captions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-glass">
  <div id="status-pill" class="status-pill hide">
    <span class="status-dot"></span>
    <span id="status-text"></span>
  </div>

  <main id="caption-container" class="caption-container">
    <div id="caption-card" class="caption-card empty">
      <div id="caption-body" class="caption-body">
        <span id="caption-committed" class="caption-committed"></span>
        <span id="caption-live" class="caption-live"></span>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
