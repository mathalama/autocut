[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autocut"
version = "0.1.0"
description = "Real-time AI subtitles and captions engine for OBS and live recording."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "faster-whisper>=1.2.0",
  "numpy>=2.0.0",
  "pydantic>=2.10.0",
  "rich>=13.0.0",
  "sounddevice>=0.5.0",
  "typer>=0.15.0",
  "websockets>=13.0.0",
  "keyboard>=0.13.5",
]

[project.scripts]
autocut = "autocut.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autocut"]
